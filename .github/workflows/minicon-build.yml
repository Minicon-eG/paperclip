name: minicon-build
# Baut das Minicon-Image aus minicon/main. Wird auch vom Sync-Workflow per workflow_dispatch gestartet
# (Pushes mit GITHUB_TOKEN lösen keine Workflows aus).
on:
  push:
    branches: [minicon/main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: minicon-build
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tags bestimmen
        id: meta
        run: |
          base=$(cat .minicon/base-tag)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          img=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/paperclip
          echo "tags=$img:latest,$img:${base}-minicon,$img:${base}-minicon-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.base }}-minicon
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
